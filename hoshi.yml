# Hoshi 的默认插件组合。改这一份就能增减插件，不必改 CLI 代码。
# 命令行的 --model、--system、--no-tools、--no-approvals、--yes 仍会覆盖这里。
name: default
plugins:
  - plugin: tools
  - plugin: approvals
  - plugin: shell
  - plugin: filesystem
  # 要接 MCP 服务器时取消注释，或再复制一段改 serverName。
  # - plugin: mcp
  #   config:
  #     serverName: filesystem
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
  - plugin: llm-deepseek
